<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a1-title a1-desc">
  <title id="a1-title">Article 1 mark — the boxed-vs-built diptych</title>
  <desc id="a1-desc">Empty rental box on the left, constituted M4 lattice asset on the right, divided by a navy hairline. Visual restatement of the title "You Don't Buy a Transformation. You Build One."</desc>
  <rect x="20" y="70" width="60" height="60" fill="none" stroke="#7A756A" stroke-width="1.5"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="#142840" stroke-width="2"/>
  <rect x="120" y="70" width="18" height="18" fill="#142840"/>
  <rect x="162" y="70" width="18" height="18" fill="#142840"/>
  <rect x="120" y="112" width="18" height="18" fill="#142840"/>
  <rect x="162" y="112" width="18" height="18" fill="#142840"/>
  <rect x="141" y="70" width="18" height="18" fill="none" stroke="#142840" stroke-width="1.5"/>
  <rect x="120" y="91" width="18" height="18" fill="none" stroke="#142840" stroke-width="1.5"/>
  <rect x="162" y="91" width="18" height="18" fill="none" stroke="#142840" stroke-width="1.5"/>
  <rect x="141" y="112" width="18" height="18" fill="none" stroke="#142840" stroke-width="1.5"/>
  <rect x="141" y="91" width="18" height="18" fill="#FACC15"/>
</svg>
