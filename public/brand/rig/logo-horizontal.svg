<svg viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="THE RIG horizontal logo H2 standard 480x120">
  <title>THE RIG horizontal logo v0.3 H2 standard (480x120 · 4:1 aspect)</title>
  <desc>THE RIG horizontal lockup v0.3 H2 default · 480x120 · 4:1 aspect · 24px clear-space padding. Mark left (V1 marionette · C2 color · 64x76 effective) · 24px spacing · wordmark right (THE Steel · RIG Navy · ~280px wide). Workhorse for email signatures · document headers · slide deck footers · web navbars. Minimum size: 240x60.</desc>
  <!-- Mark · 64px wide · positioned left with 24px padding -->
  <g transform="translate(24, 22) scale(0.3667)">
    <rect x="60" y="20" width="80" height="10" rx="2" fill="#0f172a"/>
    <rect x="96" y="30" width="8" height="22" rx="2" fill="#0f172a"/>
    <rect x="20" y="52" width="160" height="12" rx="2" fill="#0f172a"/>
    <circle cx="40" cy="64" r="2.5" fill="#0f172a"/>
    <circle cx="100" cy="64" r="2.5" fill="#64748b"/>
    <circle cx="160" cy="64" r="2.5" fill="#0f172a"/>
    <path d="M 40 64 Q 38 130 42 160" stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 100 64 Q 100 140 100 210" stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 160 64 Q 162 110 158 138" stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <polygon points="32,160 48,160 40,176" fill="#0f172a"/>
    <polygon points="92,210 108,210 100,226" fill="#7c2d12"/>
    <polygon points="150,138 166,138 158,154" fill="#0f172a"/>
  </g>
  <!-- Wordmark · positioned right of mark with 24px spacing -->
  <text x="136" y="46" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="9" fill="#64748b">THE</text>
  <text x="136" y="98" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-2.5" fill="#0f172a">RIG</text>
</svg>
