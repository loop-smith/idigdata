<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="THE RIG mark">
  <title>THE RIG mark — marionette controller</title>
  <desc>Marionette controller silhouette: top T-handle grip (rigid · the operator's hold), three strings descending with slight catenary curves at asymmetric lengths (flow · projects at different stages), three small triangular weight anchors (grounded · each project lands). Single unified form, captures rigid+flow duality. Authored 2026-04-26 in ops_cw.</desc>

  <!-- Top handle bar (the operator's grip) -->
  <rect x="60" y="20" width="180" height="22" rx="6" fill="#0f172a"/>

  <!-- Vertical stem connecting handle to crossbar -->
  <rect x="142" y="42" width="16" height="50" rx="4" fill="#0f172a"/>

  <!-- Crossbar (where strings attach) - the harness frame -->
  <rect x="20" y="88" width="260" height="18" rx="5" fill="#0f172a"/>

  <!-- Three strings descending under tension - asymmetric lengths -->
  <path d="M 60 106 Q 55 180 58 240"
        stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 150 106 Q 152 200 150 280"
        stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 240 106 Q 245 170 242 220"
        stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Three triangular weight anchors at varied positions -->
  <polygon points="48,240 68,240 58,258" fill="#0f172a"/>
  <polygon points="140,280 160,280 150,298" fill="#0f172a"/>
  <polygon points="232,220 252,220 242,238" fill="#0f172a"/>
</svg>
