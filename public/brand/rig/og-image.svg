<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="THE RIG social card">
  <title>THE RIG OpenGraph card</title>
  <desc>Social preview card for THE RIG product brand.</desc>
  <rect width="1200" height="630" fill="#fafaf7"/>
  <g transform="translate(92, 92) scale(0.62)">
    <rect x="60" y="20" width="180" height="22" rx="6" fill="#0f172a"/>
    <rect x="142" y="42" width="16" height="50" rx="4" fill="#0f172a"/>
    <rect x="20" y="88" width="260" height="18" rx="5" fill="#0f172a"/>
    <path d="M 60 106 Q 55 180 58 240" stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 150 106 Q 152 200 150 280" stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 240 106 Q 245 170 242 220" stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
