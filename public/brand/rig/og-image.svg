  <text x="96" y="465" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a">The machine that builds the machines that build assets.</text>
  <text x="96" y="520" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#64748b">Frame your flow. Run many builds from one filesystem-native harness.</text>
  <path d="M 770 560 C 835 525, 895 595, 958 560 C 998 538, 1042 580, 1105 552" stroke="#7c2d12" stroke-width="5" fill="none" stroke-linecap="round"/>
