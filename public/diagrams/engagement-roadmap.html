<style>
  /* ===========================================================
     BOSS brand v2.4.6.4.6 (per boss/brand/brand-assets.md + DESIGN.md)
     Deep navy #1F2937 (delivery) · Sun gold #FACC15 (agentic + Golive)
     Stone #E5E4DD (alt lanes) · warm gray #6B7280 (axis/labels)
     Helvetica Black approximation (header · Druk Wide Super target) · Georgia Italic (value-prop) · system-ui (axis/labels) · v2 refit per dispatch-006 Option C 2026-05-17
     This artifact is BOSS PM Suite Layer 6 rendered live with engagement-specific fill.
     Engagement config currently set to Example Engagement (2026-07-01 → 2028-05-01).
     =========================================================== */
  :root {
    --navy: #1F2937;
    --navy-deep: #0E1D2E;
    --gold: #FACC15;
    --gold-deep: #D4A60E;
    --cream: #E5E4DD;
    --stone-line: #D8D5C8;
    --text: #1F2937;
    --muted: #6B7280;
    --bg: #FAFAF8;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px;
    line-height: 1.5;
  }

  h1, h2, h3, .display, .wordmark {
    font-family: 'Helvetica Neue', Georgia, serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-left { display: flex; flex-direction: column; gap: 4px; }
  .wordmark { font-size: 28px; color: var(--navy); }
  .kicker {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }
  .legend {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    width: 16px;
    height: 12px;
    border-radius: 2px;
    opacity: 0.55;
  }

  /* View toggle */
  .toggle {
    display: inline-flex;
    background: white;
    border: 1px solid var(--stone-line);
    border-radius: 999px;
    padding: 4px;
    font-size: 12px;
    font-weight: 600;
  }
  .toggle button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .toggle button:hover { color: var(--navy); }
  .toggle button.active {
    background: var(--navy);
    color: white;
  }

  /* Engagement meta */
  .engagement-meta { margin-bottom: 20px; }
  .engagement-meta h1 {
    font-size: 32px;
    color: var(--navy);
    margin: 0 0 4px;
    line-height: 1.1;
  }
  .engagement-meta .sub {
    font-family: 'Lora', Georgia, serif;
    font-style: italic;
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .engagement-meta .dates {
    font-size: 13px;
    color: var(--muted);
  }
  .engagement-meta .dates strong {
    color: var(--navy);
    font-weight: 600;
  }
  .standalone-note {
    display: none;
    font-family: 'Lora', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: var(--navy);
    margin-top: 8px;
    padding: 10px 14px;
    background: #FEF9E7;
    border-left: 3px solid var(--gold);
    border-radius: 2px;
  }
  body.view-standalone-transformation .standalone-note,
  body.view-standalone-agentics .standalone-note { display: block; }

  body.view-standalone-agentics .dates { display: none; }

  /* Diagram container */
  .diagram {
    background: white;
    border: 1px solid var(--stone-line);
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  #roadmap {
    width: 100%;
    height: auto;
    min-width: 920px;
    display: block;
  }

  /* Lane click target cursor */
  .lane-target { cursor: pointer; }
  .lane-target:hover + .lane-hover-bg,
  .lane-target.selected + .lane-hover-bg {
    fill: rgba(20, 40, 64, 0.04);
  }

  /* Substance panel */
  .substance {
    background: white;
    border: 1px solid var(--stone-line);
    border-left: 4px solid var(--navy);
    border-radius: 4px;
    padding: 24px 28px;
    margin-bottom: 28px;
    display: none;
  }
  .substance.open { display: block; }
  .substance .lane-name {
    font-family: 'Helvetica Neue', Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--navy);
    margin: 0 0 4px;
  }
  .substance .lane-kicker {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 18px;
    font-weight: 600;
  }
  .substance .delivers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    margin-bottom: 18px;
  }
  .substance.single-list .delivers {
    grid-template-columns: 1fr;
  }
  .substance .col-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--stone-line);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .substance .col-label::before {
    content: "";
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .substance .col-label.delivery::before { background: var(--navy); opacity: 0.55; }
  .substance .col-label.agentic::before  { background: var(--gold); opacity: 0.85; }
  .substance ul {
    padding-left: 18px;
    margin: 0;
    font-size: 13.5px;
  }
  .substance li {
    margin-bottom: 7px;
    color: var(--text);
    line-height: 1.5;
  }
  .substance .vp {
    font-family: 'Lora', Georgia, serif;
    font-style: italic;
    font-size: 14.5px;
    color: var(--navy);
    border-top: 1px solid var(--stone-line);
    padding-top: 14px;
    line-height: 1.6;
  }

  /* Empty-state hint */
  .hint {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    text-align: center;
    margin: -8px 0 24px;
  }

  /* Footer */
  .footer {
    margin-top: 36px;
    padding-top: 14px;
    border-top: 1px solid var(--stone-line);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.05em;
  }

  /* Mobile: stack header, accordion substance, retain horizontal scroll */
  @media (max-width: 768px) {
    body { padding: 16px; }
    .header { flex-direction: column; align-items: flex-start; }
    .header-right { align-items: flex-start; }
    .engagement-meta h1 { font-size: 24px; }
    .substance { padding: 18px 18px; }
    .substance .delivers { grid-template-columns: 1fr; gap: 18px; }
    .legend { flex-wrap: wrap; gap: 12px; }
    #roadmap { min-width: 740px; }
    .toggle { flex-direction: column; align-items: stretch; border-radius: 8px; gap: 2px; width: 100%; max-width: 320px; }
    .toggle button { text-align: center; }
  }

  /* NEW v2 · 380px narrow-mobile breakpoint per idigdata site spec (memo-054 §3.1) */
  @media (max-width: 380px) {
    body { padding: 12px; }
    .wordmark { font-size: 22px; }
    .engagement-meta h1 { font-size: 20px; }
    .engagement-meta .sub { font-size: 13px; }
    .engagement-meta .dates { font-size: 12px; }
    .diagram { padding: 4px; }
    #roadmap { min-width: 720px; }  /* keep roadmap scrollable but readable */
    .substance { padding: 14px 12px; }
    .substance .lane-name { font-size: 18px; }
    .substance ul { font-size: 12.5px; }
    .substance .vp { font-size: 13px; }
    .toggle button { padding: 8px 12px; font-size: 11px; }
    .hint { font-size: 11px; }
    .footer { font-size: 10px; }
  }

  @media print {
    body { padding: 16px; background: white; }
    .toggle, .hint { display: none; }
    .substance { display: block; page-break-inside: avoid; }
    .diagram { page-break-inside: avoid; border: none; }
  }
</style>

function toDate(s) { return new Date(s + "T00:00:00"); }
function fmtMY(d) { return toDate(d).toLocaleDateString("en-US", { month: "short", year: "2-digit" }); }
function fmtFull(d) { return toDate(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
function monthsBetween(a, b) {
  const da = toDate(a), db = toDate(b);
  return (db.getFullYear() - da.getFullYear()) * 12
       + (db.getMonth() - da.getMonth())
       + (db.getDate() - da.getDate()) / DAYS_PER_MONTH;
}
function addMonths(s, m) {
  const dt = toDate(s);
  dt.setMonth(dt.getMonth() + m);
  return dt.toISOString().split("T")[0];
}

function hashToView(h) {
  if (h === "#standalone-agentics") return "standalone-agentics";
  if (h === "#standalone-transformation") return "standalone-transformation";
  return "bundled";
}

let state = {
  view: hashToView(window.location.hash),
  selectedLane: null
};

function xForSample(i) {
  return X_LEFT + (i / N_MONTHS_BUNDLED) * PLOT_W;
}
function xForSampleEdge(i) {
  return X_LEFT + (i / N_MONTHS_BUNDLED) * PLOT_W;
}

function laneTop(idx)    { return PLOT_TOP + idx * LANE_H; }
function laneBottom(idx) { return laneTop(idx) + LANE_H; }
function laneBaseline(idx) { return laneBottom(idx) - 6; }
function laneCeiling(idx)  { return laneTop(idx) + 6; }
function laneUsable(idx)   { return laneBaseline(idx) - laneCeiling(idx); }

function curveYForDensity(idx, d) {
  return laneBaseline(idx) - d * laneUsable(idx);
}

function escapeXml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

function svgEl(tag, attrs, inner) {
  const parts = [];
  for (const k in attrs) {
    if (attrs[k] === undefined || attrs[k] === null) continue;
    parts.push(`${k}="${attrs[k]}"`);
  }
  if (inner === undefined) return `<${tag} ${parts.join(" ")}/>`;
  return `<${tag} ${parts.join(" ")}>${inner}</${tag}>`;
}

function curveAreaPath(densities, idx) {
  const baseline = laneBaseline(idx);
  let d = `M ${xForSample(0)} ${baseline}`;
  for (let i = 0; i < densities.length; i++) {
    d += ` L ${xForSample(i)} ${curveYForDensity(idx, densities[i])}`;
  }
  d += ` L ${xForSampleEdge(densities.length)} ${curveYForDensity(idx, densities[densities.length - 1])}`;
  d += ` L ${xForSampleEdge(densities.length)} ${baseline}`;
  d += ` Z`;
  return d;
}

function renderRoadmap() {
  const svg = document.getElementById("roadmap");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  let s = "";

  // SVG defs (NEW v2 · CI/CD loop arrow marker)
  s += `<defs>
    <marker id="ci-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FACC15" stroke="#1F2937" stroke-width="0.6"/>
    </marker>
  </defs>`;

  for (let i = 0; i < N_LANES; i++) {
    const yT = laneTop(i);
    const fill = (i % 2 === 1) ? "#F4F2EA" : "#FFFFFF";
    s += svgEl("rect", { x: X_LEFT, y: yT, width: PLOT_W, height: LANE_H, fill });
  }

  s += svgEl("rect", { x: 0, y: PLOT_TOP, width: GUTTER_W, height: N_LANES * LANE_H, fill: "#FAFAF8" });
  s += svgEl("line", { x1: GUTTER_W, y1: PLOT_TOP, x2: GUTTER_W, y2: PLOT_BOTTOM, stroke: "#D8D5C8", "stroke-width": 1 });

  for (let i = 0; i <= N_LANES; i++) {
    const y = PLOT_TOP + i * LANE_H;
    s += svgEl("line", { x1: 0, y1: y, x2: X_RIGHT, y2: y, stroke: "#E8E5DA", "stroke-width": 1 });
  }

  for (let i = 0; i < N_LANES; i++) {
    const lane = LANES[i];
    const cy = laneTop(i) + LANE_H / 2;
    const isPMO = lane.continuous;
    s += svgEl("text", {
      x: GUTTER_W - 16, y: cy - 4,
      "text-anchor": "end", "dominant-baseline": "middle",
      "font-family": "'Helvetica Neue', 'Arial Black', Impact, Georgia, serif", "font-weight": 700,
      "font-size": isPMO ? 16 : 15, fill: "#1F2937"
    }, escapeXml(lane.name));
    s += svgEl("text", {
      x: GUTTER_W - 16, y: cy + 13,
      "text-anchor": "end", "dominant-baseline": "middle",
      "font-family": "Inter, sans-serif", "font-weight": 500,
      "font-size": 9, fill: "#6B7280", "letter-spacing": "0.08em"
    }, isPMO ? "ORCHESTRATION" : "BOSS STAGE");
  }

  for (let i = 0; i < N_LANES; i++) {
    const lane = LANES[i];
    if (lane.continuous) {
      const yTop = curveYForDensity(i, 0.7);
      const yBase = laneBaseline(i);
      s += svgEl("rect", {
        x: xForSample(0), y: yTop,
        width: xForSampleEdge(N_MONTHS_BUNDLED) - xForSample(0),
        height: yBase - yTop,
        fill: "#1F2937", "fill-opacity": 0.75, rx: 1,
        "data-portfolio": "pmo"
      });
    } else {
      for (const portfolio of config.portfolios) {
        const densities = portfolio.curves[lane.id];
        if (!densities) continue;
        const path = curveAreaPath(densities, i);
        s += svgEl("path", {
          d: path,
          fill: portfolio.color,
          "fill-opacity": 0.45,
          stroke: portfolio.color,
          "stroke-width": 1,
          "stroke-opacity": 0.7,
          "data-portfolio": portfolio.id,
          "data-lane": lane.id
        });
      }
    }
  }

  const goliveX = xForSample(config.goLiveMarker.monthIndex);
  s += svgEl("line", {
    x1: goliveX, y1: PLOT_TOP - 6,
    x2: goliveX, y2: PLOT_BOTTOM + 4,
    stroke: "#FACC15", "stroke-width": 2.5,
    "data-marker": "golive"
  });
  s += svgEl("circle", {
    cx: goliveX, cy: PLOT_TOP - 10,
    r: 4, fill: "#FACC15",
    "data-marker": "golive"
  });
  s += svgEl("text", {
    x: goliveX, y: PLOT_TOP - 16,
    "text-anchor": "middle",
    "font-family": "Inter, sans-serif", "font-weight": 700,
    "font-size": 11, fill: "#1F2937",
    "data-marker": "golive"
  }, `${escapeXml(config.goLiveMarker.label)} · ${escapeXml(fmtFull(config.goLiveMarker.date))}`);

  s += svgEl("line", {
    x1: X_LEFT, y1: PLOT_BOTTOM,
    x2: X_RIGHT, y2: PLOT_BOTTOM,
    stroke: "#1F2937", "stroke-width": 1
  });

  if (state.view !== "standalone-agentics") {
    for (let m = 0; m <= N_MONTHS_BUNDLED; m += 3) {
      const x = xForSample(m);
      s += svgEl("line", { x1: x, y1: PLOT_BOTTOM, x2: x, y2: PLOT_BOTTOM + 6, stroke: "#1F2937", "stroke-width": 1 });
      s += svgEl("line", { x1: x, y1: PLOT_TOP, x2: x, y2: PLOT_BOTTOM, stroke: "#E8E5DA", "stroke-width": 1, "stroke-dasharray": "2,3" });
      const dateStr = addMonths(config.startDate, m);
      s += svgEl("text", {
        x: x, y: PLOT_BOTTOM + 20,
        "text-anchor": "middle",
        "font-family": "Inter, sans-serif", "font-weight": 500,
        "font-size": 11, fill: "#6B7280"
      }, escapeXml(fmtMY(dateStr)));
    }

    const totalDays = monthsBetween(config.startDate, addMonths(config.startDate, N_MONTHS_BUNDLED)) * DAYS_PER_MONTH;
    for (let d = 0; d <= totalDays; d += SPRINT_DAYS) {
      const fracMonths = d / DAYS_PER_MONTH;
      const x = X_LEFT + (fracMonths / N_MONTHS_BUNDLED) * PLOT_W;
      s += svgEl("line", { x1: x, y1: PLOT_BOTTOM + 6, x2: x, y2: PLOT_BOTTOM + 10, stroke: "#6B7280", "stroke-width": 0.7, opacity: 0.5 });
    }

    s += svgEl("text", {
      x: X_LEFT, y: PLOT_BOTTOM + AXIS_BAND - 6,
      "text-anchor": "start",
      "font-family": "Inter, sans-serif", "font-style": "italic",
      "font-size": 10, fill: "#6B7280"
    }, "14-day sprints · ~52 sprints over 24-month engagement window");

  } else {
    for (let d = 0; d <= N_DAYS_STANDALONE; d += 30) {
      const frac = d / N_DAYS_STANDALONE;
      const x = X_LEFT + frac * PLOT_W;
      s += svgEl("line", { x1: x, y1: PLOT_BOTTOM, x2: x, y2: PLOT_BOTTOM + 6, stroke: "#1F2937", "stroke-width": 1 });
      s += svgEl("line", { x1: x, y1: PLOT_TOP, x2: x, y2: PLOT_BOTTOM, stroke: "#E8E5DA", "stroke-width": 1, "stroke-dasharray": "2,3" });
      s += svgEl("text", {
        x: x, y: PLOT_BOTTOM + 20,
        "text-anchor": "middle",
        "font-family": "Inter, sans-serif", "font-weight": 500,
        "font-size": 11, fill: "#6B7280"
      }, `Day ${d}`);
    }

    for (let d = 0; d <= N_DAYS_STANDALONE; d += SPRINT_DAYS) {
      const x = X_LEFT + (d / N_DAYS_STANDALONE) * PLOT_W;
      s += svgEl("line", { x1: x, y1: PLOT_BOTTOM + 6, x2: x, y2: PLOT_BOTTOM + 10, stroke: "#6B7280", "stroke-width": 0.7, opacity: 0.5 });
    }

    s += svgEl("text", {
      x: X_LEFT, y: PLOT_BOTTOM + AXIS_BAND - 6,
      "text-anchor": "start",
      "font-family": "Inter, sans-serif", "font-style": "italic",
      "font-size": 10, fill: "#6B7280"
    }, "14-day sprints · standalone agentic engagement, 60–120 day window (90-day shape shown)");
  }

  for (let i = 0; i < N_LANES; i++) {
    const lane = LANES[i];
    const isSelected = state.selectedLane === lane.id;
    s += svgEl("rect", {
      x: 0, y: laneTop(i),
      width: X_RIGHT, height: LANE_H,
      fill: isSelected ? "rgba(20,40,64,0.06)" : "transparent",
      "data-lane-target": lane.id,
      class: "lane-target",
      role: "button",
      tabindex: 0,
      "aria-label": `${lane.name} — click to expand details`
    });
    if (isSelected) {
      s += svgEl("rect", {
        x: 0, y: laneTop(i),
        width: 4, height: LANE_H,
        fill: "#1F2937"
      });
    }
  }

  
  // ============ NEW v2 · CI/CD-by-design loop band ============
  // Curved gold dashed arrow from right (post-stable-state) sweeping back to left (next-build-plan entry)
  // Sits below the axis band · visually encodes "stable state opens next build plan, operator-led"
  const ciTop = PLOT_BOTTOM + AXIS_BAND + 8;
  const ciBottom = ciTop + CI_LOOP_BAND - 16;
  const ciMidY = (ciTop + ciBottom) / 2;

  // Background tint band (subtle gold)
  s += svgEl("rect", {
    x: X_LEFT, y: ciTop,
    width: PLOT_W, height: ciBottom - ciTop,
    fill: "#FACC15", "fill-opacity": 0.08,
    stroke: "#FACC15", "stroke-width": 1, "stroke-opacity": 0.5,
    rx: 6
  });

  // Curved loop arrow (right → left · simulates "loop back" continuation)
  const arrowStartX = X_RIGHT - 30;
  const arrowEndX = X_LEFT + 30;
  s += svgEl("path", {
    d: `M ${arrowStartX} ${ciTop + 8} Q ${X_RIGHT - 100} ${ciBottom - 4} ${(X_LEFT + X_RIGHT) / 2} ${ciBottom - 4} Q ${X_LEFT + 100} ${ciBottom - 4} ${arrowEndX} ${ciTop + 8}`,
    fill: "none",
    stroke: "#FACC15", "stroke-width": 2.5, "stroke-dasharray": "6 4",
    "marker-end": "url(#ci-loop-arrow)"
  });

  // CI/CD-by-design label · centered in band
  s += svgEl("text", {
    x: (X_LEFT + X_RIGHT) / 2, y: ciMidY - 4,
    "text-anchor": "middle",
    "font-family": "'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif",
    "font-weight": 900, "font-size": 11, fill: "#1F2937",
    "letter-spacing": "3"
  }, "◆ CI/CD BY DESIGN ◆");

  s += svgEl("text", {
    x: (X_LEFT + X_RIGHT) / 2, y: ciMidY + 12,
    "text-anchor": "middle",
    "font-family": "Georgia, 'Times New Roman', serif",
    "font-style": "italic", "font-size": 10, fill: "#6B6860"
  }, "stable state opens next build plan (operator-led) · the engagement doesn't end at go-live");

  // Endpoint labels
  s += svgEl("text", {
    x: arrowStartX - 6, y: ciTop + 4,
    "text-anchor": "end",
    "font-family": "system-ui, -apple-system, sans-serif",
    "font-weight": 700, "font-size": 9, fill: "#1F2937"
  }, "stable state →");
  s += svgEl("text", {
    x: arrowEndX + 6, y: ciTop + 4,
    "text-anchor": "start",
    "font-family": "system-ui, -apple-system, sans-serif",
    "font-weight": 700, "font-size": 9, fill: "#1F2937"
  }, "→ next build plan");

  // ============ end CI/CD loop band ============


  svg.innerHTML = s;

  applyViewVisibility();

  svg.querySelectorAll("[data-lane-target]").forEach(el => {
    const laneId = el.getAttribute("data-lane-target");
    el.addEventListener("click", () => toggleLane(laneId));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleLane(laneId);
      }
    });
  });
}

function applyViewVisibility() {
  const svg = document.getElementById("roadmap");
  const view = state.view;
  const isAgenticsOnly = view === "standalone-agentics";
  const isTransformationOnly = view === "standalone-transformation";

  svg.querySelectorAll('[data-portfolio="delivery"]').forEach(el => {
    el.style.display = isAgenticsOnly ? "none" : "";
  });
  svg.querySelectorAll('[data-portfolio="agentic"]').forEach(el => {
    el.style.display = isTransformationOnly ? "none" : "";
  });
  svg.querySelectorAll('[data-marker="golive"]').forEach(el => {
    el.style.display = isAgenticsOnly ? "none" : "";
  });

  document.body.classList.remove("view-bundled", "view-standalone-transformation", "view-standalone-agentics");
  document.body.classList.add("view-" + view);

  ["bundled", "standalone-transformation", "standalone-agentics"].forEach(b => {
    const btn = document.getElementById("btn-" + b);
    if (!btn) return;
    const active = view === b;
    btn.classList.toggle("active", active);
    btn.setAttribute("aria-selected", String(active));
  });

  const note = document.getElementById("standalone-note");
  if (note) {
    if (isAgenticsOnly) {
      note.textContent = "Standalone production-agentics view — Production Agentics Portfolio commissioned alone, 60–120 day timeline (90-day shape shown). Transformation Portfolio hidden.";
    } else if (isTransformationOnly) {
      note.textContent = "Standalone transformation view — Transformation Portfolio commissioned alone, 22-month engagement window. Production Agentics Portfolio hidden.";
    } else {
      note.textContent = "";
    }
  }

  const legendItems = document.getElementById("legend").querySelectorAll(".legend-item");
  if (legendItems[0]) legendItems[0].style.opacity = isAgenticsOnly ? "0.3" : "1";
  if (legendItems[1]) legendItems[1].style.opacity = isTransformationOnly ? "0.3" : "1";
}

function listToHTML(items) {
  return "<ul>" + items.map(i => `<li>${i}</li>`).join("") + "</ul>";
}

function renderSubstance(laneId) {
  const panel = document.getElementById("substance");
  if (!laneId) {
    panel.classList.remove("open");
    panel.innerHTML = "";
    return;
  }
  const lane = LANES.find(l => l.id === laneId);
  if (!lane) return;

  const isSingle = lane.continuous;
  panel.classList.toggle("single-list", isSingle);

  let deliversBlock;
  if (isSingle) {
    deliversBlock = `
      <div>
        <div class="col-label">Delivers</div>
        ${listToHTML(lane.delivers)}
      </div>
    `;
  } else {
    deliversBlock = `
      <div>
        <div class="col-label delivery">Transformation Portfolio</div>
        ${listToHTML(lane.delivers.delivery)}
      </div>
      <div>
        <div class="col-label agentic">Production Agentics Portfolio</div>
        ${listToHTML(lane.delivers.agentic)}
      </div>
    `;
  }

  panel.innerHTML = `
    <div class="lane-kicker">${isSingle ? "Orchestration lane" : "BOSS delivery stage"}</div>
    <div class="lane-name">${lane.name}</div>
    <div class="delivers">${deliversBlock}</div>
    <div class="vp">${lane.valueProp}</div>
  `;
  panel.classList.add("open");
}

function toggleLane(laneId) {
  if (state.selectedLane === laneId) {
    state.selectedLane = null;
  } else {
    state.selectedLane = laneId;
  }
  renderRoadmap();
  renderSubstance(state.selectedLane);

  if (state.selectedLane) {
    const panel = document.getElementById("substance");
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function setView(v) {
  state.view = v;
  state.selectedLane = null;
  renderRoadmap();
  renderSubstance(null);

  let targetHash = "";
  if (v === "standalone-agentics") targetHash = "#standalone-agentics";
  else if (v === "standalone-transformation") targetHash = "#standalone-transformation";

  if (targetHash) {
    if (window.location.hash !== targetHash) {
      history.replaceState(null, "", targetHash);
    }
  } else {
    if (window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
  }
}

function renderMeta() {
  document.getElementById("engagement-name").textContent = config.engagementName;
  document.getElementById("engagement-sub").textContent = config.engagementSubtitle;

  const startD = fmtFull(config.startDate);
  const goLiveD = fmtFull(config.goLiveDate);
  const endD = fmtFull(config.endDate);
  const totalMonths = Math.round(monthsBetween(config.startDate, config.endDate));
  const goLiveMonths = Math.round(monthsBetween(config.startDate, config.goLiveDate));

  document.getElementById("dates").innerHTML =
    `Engagement: <strong>${startD}</strong> &rarr; <strong>${endD}</strong>` +
    ` &nbsp;·&nbsp; Go-live: <strong>${goLiveD}</strong>` +
    ` &nbsp;·&nbsp; ${totalMonths} months (${goLiveMonths} to go-live + ${totalMonths - goLiveMonths} stable state)`;

  document.getElementById("generated-date").textContent =
    new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function init() {
  renderMeta();
  renderRoadmap();
  renderSubstance(null);
  applyViewVisibility();

  document.getElementById("btn-bundled").addEventListener("click", () => setView("bundled"));
  document.getElementById("btn-standalone-transformation").addEventListener("click", () => setView("standalone-transformation"));
  document.getElementById("btn-standalone-agentics").addEventListener("click", () => setView("standalone-agentics"));

  window.addEventListener("hashchange", () => {
    const v = hashToView(window.location.hash);
    if (v !== state.view) setView(v);
  });
}

init();
</script>
</body>
</html>
