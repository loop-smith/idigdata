  <text x="405" y="420" text-anchor="middle" font-weight="900" font-size="18" fill="#1F2937" letter-spacing="3" font-family="'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif">DATA</text>
  <text x="405" y="442" text-anchor="middle" font-weight="900" font-size="18" fill="#1F2937" letter-spacing="3" font-family="'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif">CORE</text>

