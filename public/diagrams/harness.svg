<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 810 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harness-title harness-desc">
  <title id="harness-title">The Harness · brand-v2 · placeholder · pending boss authoring</title>
  <desc id="harness-desc">A radial diagram showing the five harness components — governance, security, onboarding, training, operator empowerment — arranged pentagonally around a central agent node. The harness is the substrate that turns model capability into operator outcome value. Each component is a load-bearing pillar; remove any one and the deployment slips from operating-fabric component back to pilot. Sibling visualization to The Process Constellations (AV-02) and The Beehive (AV-04). Placeholder pending canonical boss authoring as a future AV plate.</desc>

  <defs>
    <linearGradient id="ring-gov" gradientUnits="userSpaceOnUse" x1="350" y1="170" x2="510" y2="330">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#1F2937" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#FACC15" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ring-sec" gradientUnits="userSpaceOnUse" x1="560" y1="320" x2="720" y2="500">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#1F2937" stop-opacity="0.62"/>
      <stop offset="80%" stop-color="#FACC15" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ring-onb" gradientUnits="userSpaceOnUse" x1="540" y1="560" x2="380" y2="780">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#FDE68A" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#FACC15" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ring-trn" gradientUnits="userSpaceOnUse" x1="280" y1="780" x2="120" y2="560">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.78"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.62"/>
      <stop offset="80%" stop-color="#FACC15" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ring-emp" gradientUnits="userSpaceOnUse" x1="90" y1="500" x2="260" y2="320">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#FACC15" stop-opacity="0.62"/>
      <stop offset="60%" stop-color="#1F2937" stop-opacity="0.92"/>
      <stop offset="85%" stop-color="#C2410C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.78"/>
    </linearGradient>
    <marker id="harness-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect width="810" height="940" fill="#FBF9F4"/>

  <text x="405" y="70" text-anchor="middle" font-weight="900" font-size="34" fill="#1F2937" font-family="Helvetica, Arial, sans-serif" letter-spacing="1">THE HARNESS</text>
  <text x="405" y="100" text-anchor="middle" font-style="italic" font-size="15" fill="#1F2937" font-family="Georgia, 'Times New Roman', serif" fill-opacity="0.75">What turns capability into outcome — five components, load-bearing</text>

  <!-- Five outer component nodes, pentagonal layout, center at (405, 510) -->
  <!-- Governance — top -->
  <g>
    <circle cx="405" cy="220" r="68" fill="url(#ring-gov)" stroke="#1F2937" stroke-width="2"/>
    <circle cx="405" cy="220" r="52" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="405" y="215" text-anchor="middle" font-weight="bold" font-size="14" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">GOVERNANCE</text>
    <text x="405" y="234" text-anchor="middle" font-size="10" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.7">decision-rights · audit · drift</text>
  </g>

  <!-- Security — upper right -->
  <g>
    <circle cx="645" cy="395" r="68" fill="url(#ring-sec)" stroke="#1F2937" stroke-width="2"/>
    <circle cx="645" cy="395" r="52" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="645" y="390" text-anchor="middle" font-weight="bold" font-size="14" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">SECURITY</text>
    <text x="645" y="409" text-anchor="middle" font-size="10" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.7">identity · access · data-handling</text>
  </g>

  <!-- Onboarding — lower right -->
  <g>
    <circle cx="555" cy="685" r="68" fill="url(#ring-onb)" stroke="#1F2937" stroke-width="2"/>
    <circle cx="555" cy="685" r="52" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="555" y="680" text-anchor="middle" font-weight="bold" font-size="14" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">ONBOARDING</text>
    <text x="555" y="699" text-anchor="middle" font-size="10" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.7">validation · scenario · cutover</text>
  </g>

  <!-- Training — lower left -->
  <g>
    <circle cx="255" cy="685" r="68" fill="url(#ring-trn)" stroke="#1F2937" stroke-width="2"/>
    <circle cx="255" cy="685" r="52" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="255" y="680" text-anchor="middle" font-weight="bold" font-size="14" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">TRAINING</text>
    <text x="255" y="699" text-anchor="middle" font-size="10" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.7">operator-specific · agent-specific</text>
  </g>

  <!-- Operator empowerment — upper left -->
  <g>
    <circle cx="165" cy="395" r="68" fill="url(#ring-emp)" stroke="#1F2937" stroke-width="2"/>
    <circle cx="165" cy="395" r="52" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.5"/>
    <text x="165" y="386" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">OPERATOR</text>
    <text x="165" y="402" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">EMPOWERMENT</text>
    <text x="165" y="418" text-anchor="middle" font-size="10" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.7">override · escalate · trust</text>
  </g>

  <!-- Connector lines from each component to center agent -->
  <line x1="405" y1="288" x2="405" y2="445" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <line x1="595" y1="425" x2="465" y2="488" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <line x1="510" y1="650" x2="445" y2="545" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <line x1="300" y1="650" x2="365" y2="545" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <line x1="215" y1="425" x2="345" y2="488" stroke="#1F2937" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 3"/>

  <!-- Center agent node (charcoal hex) -->
  <g>
    <polygon points="405,440 470,475 470,545 405,580 340,545 340,475" fill="#1F2937" stroke="#FACC15" stroke-width="2.5"/>
    <text x="405" y="500" text-anchor="middle" font-weight="bold" font-size="15" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif">AGENT</text>
    <text x="405" y="520" text-anchor="middle" font-size="10" fill="#FBF9F4" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.85">operating-fabric</text>
    <text x="405" y="535" text-anchor="middle" font-size="10" fill="#FBF9F4" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.85">component</text>
  </g>

  <!-- Outcome bar at bottom -->
  <line x1="100" y1="800" x2="710" y2="800" stroke="#1F2937" stroke-width="1" stroke-opacity="0.35"/>
  <text x="405" y="828" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2">OUTCOME VALUE</text>
  <text x="405" y="852" text-anchor="middle" font-size="11" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" fill-opacity="0.7">capacity expansion · institutional knowledge · throughput · audit-defensible decisioning</text>

  <!-- Capability bar at top (just below subtitle) -->
  <text x="405" y="130" text-anchor="middle" font-weight="bold" font-size="11" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif" letter-spacing="3" fill-opacity="0.65">MODEL CAPABILITY</text>

  <!-- Caption block -->
  <text x="405" y="895" text-anchor="middle" font-style="italic" font-size="11" fill="#1F2937" font-family="Georgia, serif" fill-opacity="0.6">Capability is necessary. The harness is what makes capability operationally meaningful.</text>
  <text x="405" y="915" text-anchor="middle" font-size="9" fill="#1F2937" font-family="system-ui, sans-serif" fill-opacity="0.45" letter-spacing="1">placeholder · sibling to AV-02 The Process Constellations + AV-04 The Beehive · pending boss canonicalization</text>
</svg>
