<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sprint-title sprint-desc">
  <title id="sprint-title">Sprint roadmap — task / story / sprint</title>
  <desc id="sprint-desc">Two-level zoom showing Phase 1 broken into 4 sprints, with Sprint 1 expanded to show 3 stories and their tasks. Persistence layer at bottom carries state from one sprint to the next.</desc>

  <!-- Title block -->
  <text x="360" y="38" text-anchor="middle" font-weight="bold" font-size="24" fill="#142840" font-family="Vollkorn, Cambria, Georgia, serif">Sprint roadmap</text>
  <text x="360" y="62" text-anchor="middle" font-style="italic" font-size="13" fill="#6B6860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Task · story · sprint · phase — every level structured · nothing lost between</text>

  <!-- LEVEL 1: Phase 1 = 4 sprints -->
  <text x="60" y="100" font-size="10" font-weight="bold" fill="#6B6860" letter-spacing="1.5" font-family="system-ui, -apple-system, sans-serif">PHASE 1 — DISCOVERY · 4 SPRINTS · ~52 DAYS</text>

  <g transform="translate(60, 112)">
    <rect x="0" y="0" width="145" height="36" fill="#FBF9F4" stroke="#142840" stroke-width="1.5" rx="2"/>
    <rect x="0" y="0" width="145" height="3" fill="#FACC15"/>
    <text x="72.5" y="22" text-anchor="middle" font-weight="bold" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sprint 1</text>
    <text x="72.5" y="32" text-anchor="middle" font-style="italic" font-size="9" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Onboarding</text>

    <rect x="150" y="0" width="145" height="36" fill="#FBF9F4" stroke="#142840" stroke-width="1.5" rx="2"/>
    <text x="222.5" y="22" text-anchor="middle" font-weight="bold" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sprint 2</text>
    <text x="222.5" y="32" text-anchor="middle" font-style="italic" font-size="9" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Walk-the-floor</text>

    <rect x="300" y="0" width="145" height="36" fill="#FBF9F4" stroke="#142840" stroke-width="1.5" rx="2"/>
    <text x="372.5" y="22" text-anchor="middle" font-weight="bold" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sprint 3</text>
    <text x="372.5" y="32" text-anchor="middle" font-style="italic" font-size="9" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Constellation builds</text>

    <rect x="450" y="0" width="145" height="36" fill="#FBF9F4" stroke="#142840" stroke-width="1.5" rx="2"/>
    <text x="522.5" y="22" text-anchor="middle" font-weight="bold" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sprint 4</text>
    <text x="522.5" y="32" text-anchor="middle" font-style="italic" font-size="9" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">30-60-90 to C-suite</text>
  </g>

  <!-- Zoom connector -->
  <line x1="60" y1="148" x2="60" y2="180" stroke="#142840" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="205" y1="148" x2="660" y2="180" stroke="#142840" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- LEVEL 2: Sprint 1 anatomy -->
  <g transform="translate(60, 185)">
    <rect x="0" y="0" width="600" height="270" fill="#FBF9F4" stroke="#142840" stroke-width="1.8" rx="2"/>

    <text x="20" y="24" font-weight="bold" font-size="12" fill="#142840" letter-spacing="1.2" font-family="system-ui, -apple-system, sans-serif">SPRINT 1 — DAYS 1–13</text>
    <text x="580" y="24" text-anchor="end" font-style="italic" font-size="10" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">3 stories · 12 tasks · 1 register</text>

    <line x1="20" y1="40" x2="580" y2="40" stroke="#7A756A" stroke-width="0.5"/>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="180" height="135" fill="#FBF9F4" stroke="#7A756A" stroke-width="1" rx="2"/>
      <rect x="0" y="0" width="6" height="135" fill="#142840"/>
      <text x="14" y="18" font-weight="bold" font-size="10" fill="#142840" letter-spacing="1" font-family="system-ui, -apple-system, sans-serif">STORY · ONBOARDING</text>
      <text x="14" y="42" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Badge / accounts / orient</text>
      <text x="14" y="62" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  First 1:1 with each C-level</text>
      <text x="14" y="82" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Operator tour (3 sites)</text>
      <text x="14" y="102" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Skeleton Visios on Day 3</text>
      <text x="14" y="122" font-style="italic" font-size="10" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Output: trust posture v1</text>
    </g>

    <g transform="translate(210, 60)">
      <rect x="0" y="0" width="180" height="135" fill="#FBF9F4" stroke="#7A756A" stroke-width="1" rx="2"/>
      <rect x="0" y="0" width="6" height="135" fill="#142840"/>
      <text x="14" y="18" font-weight="bold" font-size="10" fill="#142840" letter-spacing="1" font-family="system-ui, -apple-system, sans-serif">STORY · GROUND-TRUTH</text>
      <text x="14" y="42" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Systems Register update</text>
      <text x="14" y="62" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Beehive cell population</text>
      <text x="14" y="82" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Integration topology read</text>
      <text x="14" y="102" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  MDM hypothesis v1</text>
      <text x="14" y="122" font-style="italic" font-size="10" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Output: registers ~70%</text>
    </g>

    <g transform="translate(400, 60)">
      <rect x="0" y="0" width="180" height="135" fill="#FBF9F4" stroke="#7A756A" stroke-width="1" rx="2"/>
      <rect x="0" y="0" width="6" height="135" fill="#142840"/>
      <text x="14" y="18" font-weight="bold" font-size="10" fill="#142840" letter-spacing="1" font-family="system-ui, -apple-system, sans-serif">STORY · STAKEHOLDERS</text>
      <text x="14" y="42" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Political map kickoff</text>
      <text x="14" y="62" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  CFO weekly cadence set</text>
      <text x="14" y="82" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  CIO augment-frame talk</text>
      <text x="14" y="102" font-size="11" fill="#142840" font-family="system-ui, -apple-system, sans-serif">·  Operator truth-source ID</text>
      <text x="14" y="122" font-style="italic" font-size="10" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Output: map v1 (private)</text>
    </g>

    <rect x="20" y="210" width="560" height="32" fill="#142840" rx="2"/>
    <text x="32" y="230" font-weight="bold" font-size="10" fill="#FACC15" letter-spacing="1.5" font-family="system-ui, -apple-system, sans-serif">PERSISTENCE LAYER</text>
    <text x="160" y="230" font-style="italic" font-size="11" fill="#FBF9F4" font-family="system-ui, -apple-system, sans-serif">no data lost · every output flows into Sprint 2 as input · registers compound</text>
  </g>

  <line x1="120" y1="490" x2="600" y2="490" stroke="#7A756A" stroke-width="0.8"/>
  <text x="360" y="510" text-anchor="middle" font-style="italic" font-size="12" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">55 sprints across 24 months · each one structured like this · the substrate carries it</text>
</svg>
