<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beehive-teaser-title beehive-teaser-desc">
  <title id="beehive-teaser-title">AV-04 · The Beehive · TEASER variant · brand-v2 · author-v1 · 2026-05-19</title>
  <desc id="beehive-teaser-desc">Public-tier teaser variant of the canonical beehive. Structural signature only: 13-hex honeycomb arranged 3-2-3-2-3 with center hex gold-emphasized (gestures to the data substrate · unlabeled). Strips per-hex functional-group labels + BPF flow column + MDM/CDM naming present in the canonical. Reader recognizes the framework shape exists without leaving with the framework itself. Sibling to canonical beehive.svg at boss/assets/ which remains the gated-tier home for articles + Phase 0 + engagement. Per idigdata memo-087 IP-gate-fidelity discipline (peak/teaser pattern · same shape as engagement-roadmap-public adjacent precedent).</desc>

  <!-- Background · cream substrate -->
  <rect width="540" height="600" fill="#FBF9F4"/>

  <!-- Title -->
  <text x="270" y="50" text-anchor="middle" font-weight="900" font-size="28" fill="#1F2937" letter-spacing="-0.3" font-family="'Helvetica Neue', 'Arial Black', Impact, system-ui, sans-serif">THE BEEHIVE</text>
  <text x="270" y="78" text-anchor="middle" font-style="italic" font-size="14" fill="#6B6860" font-family="Georgia, 'Times New Roman', serif">Workforce + functional groups · structural frame</text>

