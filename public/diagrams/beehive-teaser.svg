  <polygon points="250,330 284.6,350 284.6,390 250,410 215.4,390 215.4,350" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>

  <!-- Row 5 (3 hexes · bottom) -->
  <polygon points="146,390 180.6,410 180.6,450 146,470 111.4,450 111.4,410" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>
  <polygon points="215.4,390 250,410 250,450 215.4,470 180.8,450 180.8,410" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>
