  <!-- Hex polygon points (r=40 reference): 0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20 -->

  <!-- Row 1 (3 hexes · top) -->
  <polygon points="146,150 180.6,170 180.6,210 146,230 111.4,210 111.4,170" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>
  <polygon points="215.4,150 250,170 250,210 215.4,230 180.8,210 180.8,170" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>
  <polygon points="284.8,150 319.4,170 319.4,210 284.8,230 250.2,210 250.2,170" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>

  <!-- Row 2 (2 hexes · offset right) -->
