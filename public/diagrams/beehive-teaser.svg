  <polygon points="250,210 284.6,230 284.6,270 250,290 215.4,270 215.4,230" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>

  <!-- Row 3 (3 hexes · CENTER GOLD = data substrate gesture · unlabeled) -->
  <polygon points="146,270 180.6,290 180.6,330 146,350 111.4,330 111.4,290" fill="#FBF9F4" stroke="#1F2937" stroke-width="1.8"/>
