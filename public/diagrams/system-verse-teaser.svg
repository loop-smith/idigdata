<svg viewBox="0 0 800 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sv-teaser-title sv-teaser-desc">
  <title id="sv-teaser-title">AV-03 · The Systemverse · TEASER variant · brand-v2 · author-v1 · 2026-05-19</title>
  <desc id="sv-teaser-desc">Public-tier teaser variant of the canonical system-verse. Structural signature only: 3 layers · sovereign gold data core at center · integration fabric annulus surrounding it · outer ring of 16 unnamed system-group circles (number preserved to match canonical · names stripped). Spokes radiate from each ring circle inward to suggest constant traffic to the core. Strips per-group naming (PLM · Production MES · QMS · Compliance · WMS · TMS · Sustainability · Safety · EAM · ERP · HRIS · Procurement · FP&amp;A · Documents · Productivity · CRM) and architectural-inversion mechanic copy present in the canonical. Reader sees the 3-layer architecture exists without leaving with which specific systems sit where. Sibling to canonical system-verse.svg at boss/assets/ which remains the gated-tier home for articles + Phase 0 + engagement. Per idigdata memo-087 IP-gate-fidelity discipline.</desc>

  <defs>
    <!-- Integration fabric mesh (charcoal cross-hatch at low opacity) -->
    <pattern id="sv-teaser-mesh" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1F2937" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
  </defs>

