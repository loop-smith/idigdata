<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beehive-title beehive-desc">
  <title id="beehive-title">The beehive — process flows × functional groups</title>
  <desc id="beehive-desc">Hexagonal honeycomb of 13 functional system groups arranged 3-2-3-2-3 (PLM, Sales, Compliance / Production MES, Supply Chain / EAM, ERP+CDM at center, WMS / HRIS, Data Services / IT/IS, Finance/Accounting, Sustainability). Six business process flows (P2P, O2C, P2M, S2S, D2R, MDM) feed in from the left, crossing the functional groups. Standard frame everywhere; bespoke fill — 100s of BPSc per BPF, unique per operator. Same six BPFs as the constellation spine; same atom (PEG) appears in both diagrams with different coordinates.</desc>

  <!-- Background -->
  <rect width="540" height="700" fill="#FAFAF7"/>

  <!-- Arrow marker + fabric pattern definitions -->
  <defs>
    <marker id="bpf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#142840" fill-opacity="0.55"/>
    </marker>
    <pattern id="fabric-mesh" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FAFAF7"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7A756A" stroke-width="0.5" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Title block -->
  <text x="270" y="45" text-anchor="middle" font-weight="bold" font-size="24" fill="#142840" font-family="Vollkorn, Cambria, Georgia, serif">The beehive</text>
  <text x="270" y="68" text-anchor="middle" font-style="italic" font-size="13" fill="#6B6860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Process flows × functional groups · universal frame</text>

  <!-- BPF column header -->
  <text x="70" y="115" text-anchor="middle" font-style="italic" font-size="10" fill="#6B6860" letter-spacing="2" font-family="system-ui, -apple-system, sans-serif">BPF</text>

  <!-- BPF circles (left column, vertically stacked, feeding hex grid via arrows) -->
  <g>
    <circle cx="70" cy="165" r="22" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/>
    <text x="70" y="170" text-anchor="middle" font-weight="bold" font-size="12" fill="#142840" font-family="system-ui, -apple-system, sans-serif">P2P</text>
    <line x1="92" y1="165" x2="198" y2="165" stroke="#142840" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="220" r="22" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/>
    <text x="70" y="225" text-anchor="middle" font-weight="bold" font-size="12" fill="#142840" font-family="system-ui, -apple-system, sans-serif">O2C</text>
    <line x1="92" y1="220" x2="198" y2="220" stroke="#142840" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="275" r="22" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/>
    <text x="70" y="280" text-anchor="middle" font-weight="bold" font-size="12" fill="#142840" font-family="system-ui, -apple-system, sans-serif">P2M</text>
    <line x1="92" y1="275" x2="198" y2="275" stroke="#142840" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="335" r="22" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/>
    <text x="70" y="340" text-anchor="middle" font-weight="bold" font-size="12" fill="#142840" font-family="system-ui, -apple-system, sans-serif">S2S</text>
    <line x1="92" y1="335" x2="198" y2="335" stroke="#142840" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="390" r="22" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/>
    <text x="70" y="395" text-anchor="middle" font-weight="bold" font-size="12" fill="#142840" font-family="system-ui, -apple-system, sans-serif">D2R</text>
    <line x1="92" y1="390" x2="198" y2="390" stroke="#142840" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>

    <circle cx="70" cy="445" r="22" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/>
    <text x="70" y="450" text-anchor="middle" font-weight="bold" font-size="12" fill="#142840" font-family="system-ui, -apple-system, sans-serif">MDM</text>
    <line x1="92" y1="445" x2="198" y2="445" stroke="#142840" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#bpf-arrow)"/>
  </g>

  <!-- Functional groups header (above hex grid) -->
  <text x="320" y="115" text-anchor="middle" font-style="italic" font-size="10" fill="#6B6860" letter-spacing="2" font-family="system-ui, -apple-system, sans-serif">FUNCTIONAL GROUPS</text>

  <!-- Beehive fabric box (the operating fabric — BPFs connect to this; fabric routes internally to cells) -->
  <rect x="200" y="125" width="240" height="345" rx="14" fill="url(#fabric-mesh)" stroke="#142840" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Hex grid: 3-2-3-2-3 honeycomb, vertical layout. Pointy-top, r=40 -->
  <!-- Row 1: y=170 (3 cells) -->
  <g transform="translate(250.8, 170)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">PLM</text></g>
  <g transform="translate(320, 170)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sales</text></g>
  <g transform="translate(389.2, 170)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Compliance</text></g>

  <!-- Row 2: y=230 (2 cells, offset) -->
  <g transform="translate(285.4, 230)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Production</text><text x="0" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">MES</text></g>
  <g transform="translate(354.6, 230)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Supply</text><text x="0" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Chain</text></g>

  <!-- Row 3: y=290 (3 cells, ERP+CDM at center) -->
  <g transform="translate(250.8, 290)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">EAM</text></g>
  <g transform="translate(320, 290)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#142840" stroke="#FACC15" stroke-width="2"/><text x="0" y="-13" text-anchor="middle" font-size="11" font-weight="bold" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif">Data</text><text x="0" y="2" text-anchor="middle" font-size="11" font-weight="bold" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif">Services</text><text x="0" y="18" text-anchor="middle" font-size="9" font-style="italic" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif">+ CDM</text></g>
  <g transform="translate(389.2, 290)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">WMS</text></g>

  <!-- Row 4: y=350 (2 cells, offset) -->
  <g transform="translate(285.4, 350)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">HRIS</text></g>
  <g transform="translate(354.6, 350)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">ERP</text></g>

  <!-- Row 5: y=410 (3 cells) -->
  <g transform="translate(250.8, 410)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">IT/IS</text></g>
  <g transform="translate(320, 410)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="9" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Finance/</text><text x="0" y="11" text-anchor="middle" font-size="9" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Accounting</text></g>
  <g transform="translate(389.2, 410)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sustainability</text></g>

  <!-- Mid-rule callout -->
  <text x="270" y="500" text-anchor="middle" font-style="italic" font-size="11" fill="#6B6860" letter-spacing="2" font-family="system-ui, -apple-system, sans-serif">flows × groups · BPSc lives at every intersection</text>

  <!-- Stone rule + footer caption -->
  <line x1="80" y1="640" x2="460" y2="640" stroke="#7A756A" stroke-width="0.8"/>
  <text x="270" y="660" text-anchor="middle" font-style="italic" font-size="12" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Standard frame · bespoke fill · 100s of BPSc per BPF, unique per operator</text>
</svg>
