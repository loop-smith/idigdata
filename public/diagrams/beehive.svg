<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beehive-title beehive-desc">
  <title id="beehive-title">The beehive — universal frame</title>
  <desc id="beehive-desc">Hexagonal grid of 13 functional system groups in a 4-5-4 honeycomb. ERP at center, surrounded by PLM, Sales, HRIS, Compliance, Production MES, Supply Chain, Data Services, IT/IS, EAM, WMS, Finance/Accounting, Sustainability. Five process flows ring the perimeter.</desc>

  <!-- Title block -->
  <text x="300" y="40" text-anchor="middle" font-weight="bold" font-size="24" fill="#142840" font-family="Vollkorn, Cambria, Georgia, serif">The beehive</text>
  <text x="300" y="62" text-anchor="middle" font-style="italic" font-size="13" fill="#6B6860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Functional system groups · process flows · universal frame</text>

  <!-- Process flow labels -->
  <text x="300" y="100" text-anchor="middle" font-style="italic" font-size="11" fill="#6B6860" letter-spacing="3" font-family="system-ui, -apple-system, sans-serif">ORDER TO CASH</text>
  <text x="290" y="425" text-anchor="middle" font-style="italic" font-size="11" fill="#6B6860" letter-spacing="3" font-family="system-ui, -apple-system, sans-serif">PROCURE TO PAY</text>
  <g transform="translate(580, 240) rotate(90)">
    <text x="0" y="0" text-anchor="middle" font-style="italic" font-size="11" fill="#6B6860" letter-spacing="3" font-family="system-ui, -apple-system, sans-serif">PLAN TO MANUFACTURE</text>
  </g>
  <g transform="translate(20, 240) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-style="italic" font-size="11" fill="#6B6860" letter-spacing="3" font-family="system-ui, -apple-system, sans-serif">RECORD TO REPORT</text>
  </g>

  <!-- Hex cells. Pointy-top, r=40 -->
  <!-- Row 1: y=160 (PLM, Sales, HRIS, Compliance) -->
  <g transform="translate(186, 160)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">PLM</text></g>
  <g transform="translate(255.4, 160)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sales</text></g>
  <g transform="translate(324.7, 160)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">HRIS</text></g>
  <g transform="translate(394, 160)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Compliance</text></g>

  <!-- Row 2: y=220 (Production MES, Supply Chain, ERP/CDM center, Data Services, IT/IS) -->
  <g transform="translate(151.4, 220)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Production</text><text x="0" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">MES</text></g>
  <g transform="translate(220.7, 220)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Supply</text><text x="0" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Chain</text></g>
  <g transform="translate(290, 220)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#142840" stroke="#142840" stroke-width="1.5"/><text x="0" y="-3" text-anchor="middle" font-size="13" font-weight="bold" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif">ERP</text><text x="0" y="13" text-anchor="middle" font-size="9" font-style="italic" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif">+ CDM</text></g>
  <g transform="translate(359.3, 220)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Data</text><text x="0" y="11" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Services</text></g>
  <g transform="translate(428.6, 220)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">IT/IS</text></g>

  <!-- Row 3: y=280 (EAM, WMS, Finance/Accounting, Sustainability) -->
  <g transform="translate(186, 280)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">EAM</text></g>
  <g transform="translate(255.4, 280)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">WMS</text></g>
  <g transform="translate(324.7, 280)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="-2" text-anchor="middle" font-size="9" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Finance/</text><text x="0" y="11" text-anchor="middle" font-size="9" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Accounting</text></g>
  <g transform="translate(394, 280)"><polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#FBF9F4" stroke="#142840" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#142840" font-family="system-ui, -apple-system, sans-serif">Sustainability</text></g>

  <!-- Foundational label -->
  <text x="300" y="370" text-anchor="middle" font-style="italic" font-size="11" fill="#6B6860" letter-spacing="3" font-family="system-ui, -apple-system, sans-serif">SYSTEMS · DATA · SECURITY</text>

  <!-- Stone rule + caption -->
  <line x1="160" y1="455" x2="440" y2="455" stroke="#7A756A" stroke-width="0.8"/>
  <text x="300" y="473" text-anchor="middle" font-style="italic" font-size="12" fill="#6B6860" font-family="system-ui, -apple-system, sans-serif">Standard frame · bespoke fill · every $250M–$1B operating company</text>
</svg>
