<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pm-title pm-desc">
  <title id="pm-title">AV-05 · The PM Suite · brand-v2 · author-v6 · 2026-05-17</title>
  <desc id="pm-desc">The PM Ladder · 4 altitudes + TRANSFER POINT · structural-only (mini-viz stripped). AV-05 refit per Rob direction 2026-05-17 (author-v6 = simplified author-v5 · selected option B "strip" over option A "lighten" or C "two variants"). Mini-visualizations removed for cleaner reader cognition + multi-surface ferry (cover slides · articles · prospect collateral · training · dashboards): timeline arc dropped from L4 ENGAGEMENT TIMELINE · 7 stage tiles dropped from L3 ROADMAP STAGES (BPSc/BPF retained as inline rollup label text) · 4 sprint cards dropped from L2 SPRINTS · task checkbox glyphs dropped from L1 TASK card · mini story card dropped from L1 STORY card · mini sprint/stage icons dropped from TRANSFER POINT band. What remains: 4 level cards with chip + label + cadence/operator + reader question · TRANSFER POINT band with header + AGILE chip + SPRINT COMPLETION arrow + WATERFALL chip + caption · 3 rollup arrows with brief captions · L1 group header explaining peer relationship · TASK ↔ STORY text-only cards with bidirectional peer arrow · footer 3-thread credibility band. ViewBox compressed 1200×880 → 1200×720 reflecting reduced content density. Concrete examples (timeline milestones · specific stage gates · sprint task lists · etc.) belong in supporting article/prose/speaker-notes, NOT inside the AV. Structure IS the message; AV depicts invention #8 architecturally · prose carries specifics. Prior author-v5 detailed parked at _archive/pm-suite-author-v5-ladder-transfer-detailed-2026-05-17.svg as period-correct historical (revivable for technical deep-dive context if needed). Brand v2 chrome preserved.</desc>

